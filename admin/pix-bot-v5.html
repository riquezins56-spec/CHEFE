<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'>
<title>PIX e Bot WhatsApp - CHEFE TELLES</title>
<style>
body{background:#0d0d0d;color:#fff;font-family:Arial;padding:20px}
.card{background:#181818;border:1px solid #ff2a2a;border-radius:16px;padding:20px;max-width:700px}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #444;color:#fff;border-radius:8px}
button{background:#ff2a2a;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer}
</style></head><body>
<div class='card'>
<h2>💳 PIX da Loja</h2>
<input id='pixKey' placeholder='Chave PIX'>
<input id='pixName' placeholder='Nome do Recebedor'>
<button onclick='salvar()'>Salvar PIX</button>
<hr>
<h2>🤖 Bot WhatsApp</h2>
<input id='botNumber' placeholder='5573999999999'>
<textarea id='botMessage'>👋 Olá! Bem-vindo ao CHEFE TELLES FAST FOOD!

Faça seu pedido pelo nosso site e envie o comprovante PIX aqui.</textarea>
<button onclick='salvarBot()'>Salvar Bot WhatsApp</button>
</div>
<script>
const KEY='chefe_telles_v5';
const cfg=JSON.parse(localStorage.getItem(KEY)||'{}');
pixKey.value=cfg.pixKey||'';
pixName.value=cfg.pixName||'';
botNumber.value=cfg.botNumber||'';
botMessage.value=cfg.botMessage||botMessage.value;

function salvar(){
 const c={pixKey:pixKey.value,pixName:pixName.value,botNumber:botNumber.value,botMessage:botMessage.value};
 localStorage.setItem(KEY,JSON.stringify(c));
 alert('PIX salvo!');
}
function salvarBot(){
 salvar();
 if(botNumber.value){
   const msg=encodeURIComponent("🤖 TESTE DO BOT CHEFE TELLES\n\n"+botMessage.value);
   window.open("https://wa.me/"+botNumber.value.replace(/\D/g,'')+"?text="+msg);
 }
}
</script></body></html>
