<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEFE TELLES — Teste de impressão</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial;padding:30px}main{max-width:620px;margin:auto;background:#151515;border:1px solid #333;border-radius:20px;padding:25px}img{width:110px}button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#ef2029;color:#fff;font-weight:800;cursor:pointer}p{color:#aaa;line-height:1.6}.gold{color:#ffbd22}</style></head><body><main><img src="logo.png"><h1>Teste de impressão</h1><p>Esta página é acessória. No uso normal, os testes ficam dentro do painel do dono.</p><button onclick="androidTest()">🤖 TESTAR ANDROID — THERMER</button><button onclick="iphoneTest()">🍎 TESTAR IPHONE — THERMER</button><p class="gold">URL JSON: <span id="url"></span></p></main><script>const test=location.origin+'/print/test?v='+Date.now();document.querySelector('#url').textContent=test;function androidTest(){location.href='my.bluetoothprint.scheme://'+test}async function iphoneTest(){const c=document.createElement('canvas');c.width=576;c.height=300;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';x.font='bold 30px monospace';x.fillText('CHEFE TELLES',30,40);x.font='26px monospace';x.fillText('TESTE DE IMPRESSAO',30,90);x.fillText('THERMER IPHONE',30,135);x.fillText(new Date().toLocaleString('pt-BR'),30,180);const b=await new Promise(r=>c.toBlob(r,'image/png'));const f=new File([b],'teste-chefe-telles.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Teste CHEFE TELLES'});}catch(e){if(e.name!=='AbortError')alert(e.message)}}else{const u=URL.createObjectURL(b);window.open(u,'_blank')}}</script></body></html>
